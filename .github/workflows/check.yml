name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suites need python3, git, wc and sh and nothing else, so
        # they run on more than one python.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      # Pinned to commit SHAs. Tags are mutable and this
      # workflow runs on pull requests from forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The second suite reads the whole history, and the
          # release tag when HEAD carries one.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose. Both suites need no
      # Python package outside the standard library.
      - name: Run the worked-example suite and the repository suite
        run: make check
